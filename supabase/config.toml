
[auth]
site_url = "https://copycenter2000.com"
additional_redirect_urls = ["https://copycenter2000.com/reset-password", "https://copycenter2000.com/reset-password/", "https://copycenter2000.com/auth/callback", "https://copycenter2000.com/auth/callback/", "http://localhost:5173/reset-password", "http://localhost:5173/auth/callback", "http://localhost:5173/auth/callback/"]

[functions.create-payment]
enabled = true
verify_jwt = true
import_map = "./functions/create-payment/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-payment/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-payment/*.html" ]

[functions.mp-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/mp-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/mp-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/mp-webhook/*.html" ]

[functions.process-card-payment]
enabled = true
verify_jwt = true
import_map = "./functions/process-card-payment/deno.json"
entrypoint = "./functions/process-card-payment/index.ts"

[functions.upload-order-file]
enabled = true
verify_jwt = true
import_map = "./functions/upload-order-file/deno.json"
entrypoint = "./functions/upload-order-file/index.ts"

[functions.notify-admin-order]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-admin-order/index.ts"

[functions.pos-invite]
enabled = true
verify_jwt = true
entrypoint = "./functions/pos-invite/index.ts"
