const STATUS_LABELS = {
  pending_payment:  "Pendiente de pago",
  payment_approved: "Pago confirmado — En cola",
  in_progress:      "Trabajando en tu pedido",
  printing:         "Terminando de imprimir",
  ready:            "Listo para recoger",
  completed:        "Entregado",
};

const logEl = document.getElementById("log");
const btn   = document.getElementById("btn");

function log(msg, cls = "inf") {
  const span = document.createElement("span");
  span.className = cls;
  span.textContent = msg + "\n";
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

async function run() {
  btn.disabled = true;
  logEl.textContent = "";
  log("Iniciando inserción de 15 pedidos…\n");

  let ok = 0;
  for (let i = 0; i < ORDERS.length; i++) {
    const order = ORDERS[i];
    const num = String(i + 1).padStart(2, "0");
    try {
      // Insertar pedido
      const { data, error } = await db
        .from("orders")
        .insert(order)
        .select()
        .single();

      if (error) {
        log(`[${num}] ❌  ${order.customer_name}: ${error.message}`, "err");
        continue;
      }

      const shortId = String(data.id).slice(0, 8).toUpperCase();
      log(`[${num}] ✅  ${order.customer_name} → #${shortId} (${order.status})`, "ok");
      ok++;

      // Insertar historial
      await db.from("order_status_history").insert({
        order_id:   data.id,
        status:     order.status,
        message:    STATUS_LABELS[order.status] || order.status,
        created_at: order.created_at,
      });

    } catch (e) {
      log(`[${num}] ❌  ${order.customer_name}: ${e.message}`, "err");
    }
  }

  log(`\n✔ Listo: ${ok}/15 pedidos insertados correctamente.`, ok === 15 ? "ok" : "err");
  btn.disabled = false;
  btn.textContent = "↺ Volver a insertar";
}
